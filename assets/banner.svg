<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Reza — build, connect, automate</title><desc id="desc">A neon developer workbench with bold typography, a floating stack of code panels, and animated circuit signals. Web apps, automation, and integrations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D0D"/><stop offset="1" stop-color="#101C18"/></linearGradient><linearGradient id="neon"><stop stop-color="#C8FF62"/><stop offset="1" stop-color="#79A9FF"/></linearGradient><radialGradient id="glow"><stop stop-color="#C8FF62" stop-opacity=".14"/><stop offset="1" stop-color="#C8FF62" stop-opacity="0"/></radialGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#A7D78E" stroke-opacity=".08"/></pattern><clipPath id="frame"><rect x="1" y="1" width="1198" height="478" rx="18"/></clipPath></defs>
<style>.ui{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.float{animation:float 7s ease-in-out infinite}.route{animation:route 5s linear infinite}.spark{animation:spark 3s ease-in-out infinite alternate}.bar{transform-box:fill-box;transform-origin:left center;animation:bar 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}@keyframes route{to{stroke-dashoffset:-160}}@keyframes spark{from{opacity:.35}to{opacity:1}}@keyframes bar{50%{transform:scaleX(.64)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#frame)"><rect width="1200" height="480" fill="url(#bg)"/><rect width="1200" height="480" fill="url(#grid)"/><ellipse cx="1080" cy="210" rx="380" ry="330" fill="url(#glow)"/><circle class="spark" cx="57" cy="39" r="4" fill="#C8FF62"/><text class="mono" x="75" y="44" font-size="12" font-weight="500" fill="#B6C6B8" letter-spacing="1.2">RAZA-MUSAVI / BUILD STATION</text><text class="mono" x="52" y="110" font-size="19" font-weight="600" fill="#F5F8EE" letter-spacing="4">MUHAMMAD</text><text class="ui" x="47" y="247" font-size="172" font-weight="850" fill="#F5F8EE" letter-spacing="-10">REZA</text><text class="ui" x="511" y="247" font-size="172" font-weight="850" fill="#79A9FF" >.</text><text class="ui" x="52" y="307" font-size="31" font-weight="750" fill="#C8FF62" letter-spacing="-.6">BUILD. CONNECT. AUTOMATE.</text><text class="ui" x="52" y="349" font-size="21" font-weight="400" fill="#B6C6B8" >Useful web apps. Less busywork. Better connections.</text><g transform="translate(842 106)"><ellipse cx="140" cy="255" rx="174" ry="52" fill="url(#glow)"/><path d="M-34 187H7V148H58M217 33h80v68h29M254 230h45v45h-90" fill="none" stroke="#314538" stroke-width="2"/><path class="route" d="M-34 187H7V148H58M217 33h80v68h29M254 230h45v45h-90" fill="none" stroke="#79A9FF" stroke-width="2" stroke-dasharray="8 152"/><circle class="spark" cx="-34" cy="187" r="5" fill="#C8FF62"/><circle cx="-34" cy="187" r="10" fill="#C8FF62" fill-opacity=".1"/><circle class="spark" cx="326" cy="101" r="5" fill="#79A9FF"/><circle cx="326" cy="101" r="10" fill="#79A9FF" fill-opacity=".1"/><circle class="spark" cx="209" cy="275" r="5" fill="#C8FF62"/><circle cx="209" cy="275" r="10" fill="#C8FF62" fill-opacity=".1"/><g class="float"><g transform="rotate(-9 137 131)"><rect x="48" y="-6" width="238" height="208" rx="13" fill="#0D1715" stroke="#79A9FF" stroke-opacity=".65"/><rect x="23" y="21" width="238" height="208" rx="13" fill="#14251C" stroke="#C8FF62" stroke-opacity=".55"/><rect x="-2" y="48" width="238" height="208" rx="13" fill="#0D1715" stroke="#C8FF62"/><path d="M-2 84h238" stroke="#314538"/><circle cx="14" cy="66" r="3" fill="#C8FF62"/><circle cx="26" cy="66" r="3" fill="#79A9FF"/><circle cx="38" cy="66" r="3" fill="#B6C6B8"/><text class="mono" x="218" y="71" font-size="9" font-weight="500" fill="#B6C6B8" text-anchor="end">REZA / LAB</text><text class="mono" x="20" y="119" font-size="18" font-weight="500" fill="#79A9FF" >&lt;idea&gt;</text><text class="ui" x="117" y="197" font-size="87" font-weight="800" fill="#C8FF62" text-anchor="middle" letter-spacing="-5">R</text><text class="mono" x="20" y="229" font-size="15" font-weight="400" fill="#B6C6B8" >&lt;/built-to-work&gt;</text><rect class="bar" x="20" y="241" width="194" height="3" rx="1.5" fill="url(#neon)"/></g></g></g><path d="M52 404h1096" stroke="#314538"/><text class="mono" x="52" y="444" font-size="12" font-weight="500" fill="#79A9FF" >01</text><text class="mono" x="87" y="444" font-size="15" font-weight="500" fill="#F5F8EE" letter-spacing="1.2">WEB APPS</text><text class="mono" x="304" y="444" font-size="12" font-weight="500" fill="#79A9FF" >02</text><text class="mono" x="339" y="444" font-size="15" font-weight="500" fill="#F5F8EE" letter-spacing="1.2">AUTOMATION</text><text class="mono" x="602" y="444" font-size="12" font-weight="500" fill="#79A9FF" >03</text><text class="mono" x="637" y="444" font-size="15" font-weight="500" fill="#F5F8EE" letter-spacing="1.2">INTEGRATIONS</text><text class="mono" x="1145" y="444" font-size="12" font-weight="500" fill="#B6C6B8" text-anchor="end" letter-spacing="1.1">ALWAYS ITERATING ↗</text></g><rect x="1" y="1" width="1198" height="478" rx="18" fill="none" stroke="#314538"/><path d="M20 1h55m-74 19v34M1180 479h-55m74-19v-34" stroke="#C8FF62" stroke-width="2"/></svg>
