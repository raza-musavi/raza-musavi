@keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.95}}@keyframes breath{0%,100%{opacity:.55}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
