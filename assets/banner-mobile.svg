<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Reza — ideas, made useful</title><desc id="desc">Web apps, thoughtful automation, and tools that work together. An animated moon and satellite orbit beside the introduction.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101421"/><stop offset="1" stop-color="#211B3B"/></linearGradient><linearGradient id="shine"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#7DE4D2"/></linearGradient><radialGradient id="glow"><stop stop-color="#C4B5FD" stop-opacity=".14"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect x="1" y="1" width="598" height="558" rx="24"/></clipPath></defs>
<style>.ui{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.star{animation:twinkle 6s ease-in-out infinite alternate}.satellite{animation:orbit 28s linear infinite;transform-origin:0 0}.signal{animation:flow 5s linear infinite}.cursor{animation:blink 1.4s step-end infinite}@keyframes twinkle{from{opacity:.25}to{opacity:.8}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.cursor{opacity:1}}</style>
