<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-labelledby="title desc">
<title id="title">The workbench — web applications, workflow automation, API integrations</title><desc id="desc">Three neon work cards with animated circuit connections. Decorative illustrations, not live statistics.</desc>
