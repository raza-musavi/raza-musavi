<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Reza — build, connect, automate</title><desc id="desc">A neon developer workbench with bold typography, a floating stack of code panels, and animated circuit signals. Web apps, automation, and integrations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F5F7EF"/><stop offset="1" stop-color="#E5EED9"/></linearGradient><linearGradient id="neon"><stop stop-color="#3C6507"/><stop offset="1" stop-color="#2459CB"/></linearGradient><radialGradient id="glow"><stop stop-color="#3C6507" stop-opacity=".14"/><stop offset="1" stop-color="#3C6507" stop-opacity="0"/></radialGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#476E35" stroke-opacity=".08"/></pattern><clipPath id="frame"><rect x="1" y="1" width="598" height="718" rx="18"/></clipPath></defs>
<style>.ui{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}.float{animation:float 7s ease-in-out infinite}.route{animation:route 5s linear infinite}.spark{animation:spark 3s ease-in-out infinite alternate}.bar{transform-box:fill-box;transform-origin:left center;animation:bar 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}@keyframes route{to{stroke-dashoffset:-160}}@keyframes spark{from{opacity:.35}to{opacity:1}}@keyframes bar{50%{transform:scaleX(.64)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#frame)"><rect width="600" height="720" fill="url(#bg)"/><rect width="600" height="720" fill="url(#grid)"/><ellipse cx="480" cy="210" rx="380" ry="330" fill="url(#glow)"/><circle class="spark" cx="37" cy="39" r="4" fill="#3C6507"/><text class="mono" x="55" y="44" font-size="13" font-weight="500" fill="#49604E" letter-spacing="1.2">RAZA-MUSAVI / BUILD STATION</text><text class="mono" x="32" y="111" font-size="19" font-weight="600" fill="#17251B" letter-spacing="4">MUHAMMAD</text><text class="ui" x="27" y="247" font-size="148" font-weight="850" fill="#17251B" letter-spacing="-10">REZA</text><text class="ui" x="431" y="247" font-size="148" font-weight="850" fill="#2459CB" >.</text><text class="ui" x="32" y="306" font-size="31" font-weight="750" fill="#3C6507" letter-spacing="-.7">BUILD. CONNECT.</text><text class="ui" x="32" y="349" font-size="31" font-weight="750" fill="#3C6507" >AUTOMATE.</text><text class="ui" x="32" y="396" font-size="22" font-weight="400" fill="#49604E" >Useful apps. Less busywork.</text><g transform="translate(326 440) scale(.69)"><ellipse cx="140" cy="255" rx="174" ry="52" fill="url(#glow)"/><path d="M-34 187H7V148H58M217 33h80v68h29M254 230h45v45h-90" fill="none" stroke="#C2D0B8" stroke-width="2"/><path class="route" d="M-34 187H7V148H58M217 33h80v68h29M254 230h45v45h-90" fill="none" stroke="#2459CB" stroke-width="2" stroke-dasharray="8 152"/><circle class="spark" cx="-34" cy="187" r="5" fill="#3C6507"/><circle cx="-34" cy="187" r="10" fill="#3C6507" fill-opacity=".1"/><circle class="spark" cx="326" cy="101" r="5" fill="#2459CB"/><circle cx="326" cy="101" r="10" fill="#2459CB" fill-opacity=".1"/><circle class="spark" cx="209" cy="275" r="5" fill="#3C6507"/><circle cx="209" cy="275" r="10" fill="#3C6507" fill-opacity=".1"/><g class="float"><g transform="rotate(-9 137 131)"><rect x="48" y="-6" width="238" height="208" rx="13" fill="#FCFFF7" stroke="#2459CB" stroke-opacity=".65"/><rect x="23" y="21" width="238" height="208" rx="13" fill="#E6EEDC" stroke="#3C6507" stroke-opacity=".55"/><rect x="-2" y="48" width="238" height="208" rx="13" fill="#FCFFF7" stroke="#3C6507"/><path d="M-2 84h238" stroke="#C2D0B8"/><circle cx="14" cy="66" r="3" fill="#3C6507"/><circle cx="26" cy="66" r="3" fill="#2459CB"/><circle cx="38" cy="66" r="3" fill="#49604E"/><text class="mono" x="218" y="71" font-size="9" font-weight="500" fill="#49604E" text-anchor="end">REZA / LAB</text><text class="mono" x="20" y="119" font-size="18" font-weight="500" fill="#2459CB" >&lt;idea&gt;</text><text class="ui" x="117" y="197" font-size="87" font-weight="800" fill="#3C6507" text-anchor="middle" letter-spacing="-5">R</text><text class="mono" x="20" y="229" font-size="15" font-weight="400" fill="#49604E" >&lt;/built-to-work&gt;</text><rect class="bar" x="20" y="241" width="194" height="3" rx="1.5" fill="url(#neon)"/></g></g></g><text class="mono" x="32" y="468" font-size="13" font-weight="500" fill="#2459CB" >01</text><text class="mono" x="70" y="468" font-size="18" font-weight="600" fill="#17251B" >THINK</text><text class="mono" x="32" y="527" font-size="13" font-weight="500" fill="#2459CB" >02</text><text class="mono" x="70" y="527" font-size="18" font-weight="600" fill="#17251B" >BUILD</text><text class="mono" x="32" y="586" font-size="13" font-weight="500" fill="#2459CB" >03</text><text class="mono" x="70" y="586" font-size="18" font-weight="600" fill="#17251B" >REFINE</text><path d="M32 643h536" stroke="#C2D0B8"/><text class="mono" x="32" y="679" font-size="15" font-weight="500" fill="#49604E" letter-spacing="2">ALWAYS ITERATING</text><text class="ui" x="561" y="679" font-size="27" font-weight="500" fill="#3C6507" text-anchor="end">↗</text></g><rect x="1" y="1" width="598" height="718" rx="18" fill="none" stroke="#C2D0B8"/><path d="M20 1h55m-74 19v34M580 719h-55m74-19v-34" stroke="#3C6507" stroke-width="2"/></svg>
