<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-labelledby="title desc"><title id="title">What I build: web apps, automations, and integrations</title><desc id="desc">Three animated cards: a dashboard with moving bars, a workflow with traveling signals, and an API hub with orbiting connections. Decorative illustrations, not live statistics.</desc><style>
.ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="card" x2="1" y2="1"><stop stop-color="#111528"/><stop offset="1" stop-color="#1c1734"/></linearGradient><linearGradient id="bar"><stop stop-color="#b69afb"/><stop offset="1" stop-color="#73d8d5"/></linearGradient></defs>
<style>.bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 4s ease-in-out infinite}.signal{animation:flow 3s linear infinite}.hub{transform-origin:998px 66px;animation:orbit 16s linear infinite}.glimmer{animation:glimmer 4s ease-in-out infinite}.dash{animation:dash 6s linear infinite}@keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}@keyframes flow{to{stroke-dashoffset:-130}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes glimmer{50%{opacity:.35}}@keyframes dash{to{stroke-dashoffset:-180}}</style><rect x="1" y="1" width="376" height="248" rx="19" fill="url(#card)" stroke="#b89ce7" stroke-opacity=".22"/><text class="mono" x="26" y="37" fill="#837795" font-size="11">01 / WHAT I BUILD</text><text class="ui" x="26" y="148" fill="#f0e9fc" font-size="24" font-weight="650">Web applications</text><text class="ui" x="26" y="180" fill="#b4a8c6" font-size="17">Ideas made into useful apps.</text><text class="ui" x="26" y="203" fill="#9287a7" font-size="16">Dashboards · Product features</text><path class="dash" d="M26 226H350" stroke="#c1a3ff" stroke-opacity=".38" stroke-dasharray="30 150"/><rect x="412" y="1" width="376" height="248" rx="19" fill="url(#card)" stroke="#b89ce7" stroke-opacity=".22"/><text class="mono" x="437" y="37" fill="#837795" font-size="11">02 / WHAT I BUILD</text><text class="ui" x="437" y="148" fill="#f0e9fc" font-size="24" font-weight="650">Workflow automation</text><text class="ui" x="437" y="180" fill="#b4a8c6" font-size="17">Less busywork. More flow.</text><text class="ui" x="437" y="203" fill="#9287a7" font-size="16">Triggers · Actions · Workflows</text><path class="dash" d="M437 226H761" stroke="#8be2d9" stroke-opacity=".38" stroke-dasharray="30 150"/><rect x="823" y="1" width="376" height="248" rx="19" fill="url(#card)" stroke="#b89ce7" stroke-opacity=".22"/><text class="mono" x="848" y="37" fill="#837795" font-size="11">03 / WHAT I BUILD</text><text class="ui" x="848" y="148" fill="#f0e9fc" font-size="24" font-weight="650">API integrations</text><text class="ui" x="848" y="180" fill="#b4a8c6" font-size="17">Tools that work together.</text><text class="ui" x="848" y="203" fill="#9287a7" font-size="16">Payments · Messaging · Webhooks</text><path class="dash" d="M848 226H1172" stroke="#dbb4f5" stroke-opacity=".38" stroke-dasharray="30 150"/><g transform="translate(27 52)"><rect width="95" height="60" rx="7" fill="#25213a" stroke="#56436e"/><path d="M0 14H95" stroke="#56436e"/><circle cx="9" cy="7" r="1.6" fill="#bea0f0"/><rect class="bar" x="13" y="32" width="10" height="18" rx="2" fill="url(#bar)"/><rect class="bar" x="30" y="25" width="10" height="25" rx="2" fill="url(#bar)" style="animation-delay:-1s"/><rect class="bar" x="47" y="22" width="10" height="28" rx="2" fill="url(#bar)" style="animation-delay:-2s"/><rect class="bar" x="64" y="29" width="10" height="21" rx="2" fill="url(#bar)" style="animation-delay:-.5s"/></g>
<g transform="translate(441 53)"><path d="M20 18H79Q91 18 91 33V36Q91 51 104 51H153" fill="none" stroke="#315350" stroke-width="2"/><path class="signal" d="M20 18H79Q91 18 91 33V36Q91 51 104 51H153" fill="none" stroke="#8be2d9" stroke-width="3" stroke-dasharray="5 125"/><rect x="0" y="0" width="36" height="36" rx="10" fill="#183234" stroke="#436461"/><path d="M11 18L16 23L25 13" fill="none" stroke="#94e3d7" stroke-width="2"/><rect x="143" y="33" width="36" height="36" rx="10" fill="#183234" stroke="#436461"/><path d="M154 51H168M161 44V58" stroke="#94e3d7" stroke-width="2"/></g>
<g><circle cx="998" cy="79" r="29" fill="none" stroke="#745287" stroke-opacity=".5"/><path d="M950 79H977M1019 79H1053" stroke="#745287"/><circle class="glimmer" cx="946" cy="79" r="5" fill="#dfb5f1"/><circle class="glimmer" cx="1057" cy="79" r="5" fill="#8be2d9" style="animation-delay:-2s"/><g class="hub" style="transform-origin:998px 79px"><circle cx="998" cy="50" r="4" fill="#e0b3f5"/><circle cx="998" cy="108" r="3" fill="#8be2d9"/></g><rect x="977" y="59" width="42" height="40" rx="12" fill="#2a2040" stroke="#69527e"/><text class="mono" x="998" y="85" text-anchor="middle" fill="#e1c5f5" font-size="16">{ }</text></g>
